<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      (function() {
        // Silence Vite WebSocket connection errors which are expected in this environment
        const isViteError = (msg) => {
          if (!msg) return false;
          const s = msg.toString();
          return s.includes('WebSocket') || 
                 s.includes('vite') || 
                 s.includes('hmr') ||
                 s.includes('failed to connect') ||
                 s.includes('closed without opened');
        };

        // Suppress unhandled promise rejections (Vite's HMR client often causes these)
        window.addEventListener('unhandledrejection', (event) => {
          const msg = (event.reason?.message || event.reason || "").toString();
          if (isViteError(msg)) {
            event.preventDefault();
            event.stopPropagation();
          }
        });

        // Suppress global errors
        window.onerror = function(msg) {
          if (isViteError(msg)) return true;
        };

        // Suppress console methods
        const suppress = (original) => (...args) => {
          if (args.some(arg => isViteError(arg))) return;
          original.apply(console, args);
        };

        console.error = suppress(console.error);
        console.warn = suppress(console.warn);
        console.log = suppress(console.log);
        console.info = suppress(console.info);

        // Proxy WebSocket to prevent the connection attempt entirely for Vite HMR
        const OriginalWebSocket = window.WebSocket;
        window.WebSocket = function(url, protocols) {
          if (typeof url === 'string' && (url.includes('hmr') || url.includes('vite'))) {
            // Return a "dead" websocket-like object
            return {
              url,
              readyState: 3, // CLOSED
              close: () => {},
              send: () => {},
              addEventListener: () => {},
              removeEventListener: () => {},
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null
            };
          }
          try {
            return new OriginalWebSocket(url, protocols);
          } catch (e) {
            return {}; // Fallback
          }
        };
        // Copy static properties if any
        Object.keys(OriginalWebSocket).forEach(key => {
          window.WebSocket[key] = OriginalWebSocket[key];
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
